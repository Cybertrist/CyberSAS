name: cybersas
description: "CyberSAS : le client Android du réseau privé CyberSAS."
publish_to: 'none'

# Incrémenter à chaque APK envoyé : Android refuse une mise à jour dont
# le numéro n'augmente pas.
version: 0.6.1+22

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  # Les icônes au trait des maquettes, tracées depuis leur SVG.
  flutter_svg: ^2.3.0
  # Le tunnel de l'accueil reprend les tracés SVG du logo.
  local_auth: ^3.0.2
  local_auth_android: ^2.2.0
  path_parsing: ^1.1.0
  # Le QR de l'invitation, dessiné sur place : rien ne part sur Internet.
  qr_flutter: ^4.1.0
  # « Partager l'invitation » et « Ouvrir dans le navigateur ».
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
  # Polices embarquées : l'appli n'en télécharge aucune. Ce sont des polices
  # variables, la graisse se choisit avec FontVariation('wght', …).
  fonts:
    - family: Syne
      fonts:
        - asset: assets/polices/Syne.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/polices/SpaceGrotesk.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/polices/JetBrainsMono.ttf

# L'icône : le logo pris à l'intérieur de son badge, sans contour. C'est le
# système qui arrondit.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  min_sdk_android: 21
