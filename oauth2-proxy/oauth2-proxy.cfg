# oauth2-proxy : la connexion Google devant les services web.
#
# Modèle : sas.sh remplace les @...@ et écrit le résultat dans
# etat/oauth2-proxy/oauth2-proxy.cfg.
#
# Nginx lui demande, avant chaque requête vers un service protégé, si la
# personne est connectée (/oauth2/auth). Sinon, il l'envoie sur
# auth.DOMAINE, qui la renvoie chez Google, puis la ramène là où elle
# allait.

http_address = "0.0.0.0:4180"
reverse_proxy = true
# Seul Nginx, sur le réseau interne, peut dire d'où vient la requête.
trusted_proxy_ips = ["172.30.2.0/24"]

provider = "google"
client_id = "@GOOGLE_CLIENT_ID@"
client_secret_file = "/secrets/client_secret"
code_challenge_method = "S256"
redirect_url = "https://auth.@DOMAINE@/oauth2/callback"

# Personne n'entre par son domaine d'email : seules les adresses de la
# liste, tirée de etat/equipe/equipe.txt (par sas.sh, ou par sasd quand
# l'appli change l'équipe), sont acceptées.
email_domains = []
authenticated_emails_file = "/equipe/emails.txt"

# Un seul cookie pour tous les sous-domaines, et le retour n'est permis
# que vers eux.
cookie_secret_file = "/secrets/cookie_secret"
cookie_domains = [".@DOMAINE@"]
whitelist_domains = [".@DOMAINE@"]
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "12h"

# Mode vérification seule : oauth2-proxy ne relaie rien, il dit oui ou non,
# et Nginx transmet l'adresse de la personne au service.
upstreams = ["static://202"]
set_xauthrequest = true
skip_provider_button = true

request_logging = true
auth_logging = true
